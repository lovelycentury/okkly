  a `.vue` suffix so the Vue workbench reads as its own package rather
  than the shared `okkly` mark.

  Geometry (emblem + "okkly" wordmark) matches `../../../react/.storybook/brand/logo.svg`,
  the `Logo` component's `filled` variant, "multi" tone (mint→dante). This file
  is local to the Svelte package (not shared via staticDirs) so the suffix
  doesn't leak into the other frameworks' Storybooks.
-->
