<div class="okkly-inline-action__control">
  <input
    [id]="inputId()"
    class="okkly-inline-action__input"
    [type]="type()"
    [attr.name]="name() ?? null"
    [attr.placeholder]="placeholder() ?? null"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-describedby]="messageId()"
    [disabled]="disabled()"
    [readOnly]="isReadOnly()"
    [value]="value()"
    (input)="onInput($event)"
  />
  <button
    type="button"
    class="okkly-inline-action__action"
    [disabled]="isLocked()"
    [attr.aria-label]="isReadOnly() ? action() + ' (locked)' : null"
    (click)="onAction()"
  >
    <span>{{ action() }}</span>
    @if (effectiveState() === "loading") {
      <span class="okkly-inline-action__spinner" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <circle
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-dasharray="42 100"
          />
        </svg>
      </span>
    } @else {
      <span class="okkly-inline-action__icon" aria-hidden="true">
        @switch (effectiveState()) {
          @case ("readonly") {
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          }
          @case ("success") {
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 6 9 17l-5-5" />
            </svg>
          }
          @case ("error") {
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
              <path d="M8 16H3v5" />
            </svg>
          }
          @default {
            <ng-content select="[okklyInlineActionIcon]" />
            @if (!hasCustomIcon()) {
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5 12h14" />
                <path d="m12 5 7 7-7 7" />
              </svg>
            }
          }
        }
      </span>
    }
  </button>
</div>
@if (message()) {
  <span
    [id]="messageId()"
    class="okkly-inline-action__message"
    [class.okkly-inline-action__message--success]="effectiveState() === 'success'"
    [class.okkly-inline-action__message--error]="effectiveState() === 'error'"
  >
    @switch (effectiveState()) {
      @case ("loading") {
        <span class="okkly-inline-action__message-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <path d="M12 6v6l4 2" />
          </svg>
        </span>
      }
      @case ("success") {
        <span class="okkly-inline-action__message-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </span>
      }
      @case ("error") {
        <span class="okkly-inline-action__message-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z" />
            <path d="M12 9v4" />
            <path d="M12 17h.01" />
          </svg>
        </span>
      }
    }
    {{ message() }}
  </span>
}
