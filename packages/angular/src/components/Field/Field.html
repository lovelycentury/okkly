@if (label()) {
  <!--
    No whitespace between the label text and the asterisk: React renders
    `{label}{asterisk}`, and a line break here shows as a space before it.
    Prettier would put the `@if` back on its own line, hence the ignore.
  -->
  <!-- prettier-ignore -->
  <label [id]="labelId()" [attr.for]="computedFor()" class="{{ block() }}__label{{ hideLabel() ? ' ' + block() + '__label--hidden' : '' }}">{{ label() }}@if (required()) {<span class="{{ block() }}__required" aria-hidden="true">*</span>}</label>
}

<div #control class="{{ block() }}__control" (click)="controlClick.emit($event)">
  @if (hasStartAdornment()) {
    <span class="{{ block() }}__adornment"><ng-content select="[okklyFieldStartAdornment]" /></span>
  }
  <ng-content />
  @if (hasEndAdornment()) {
    <span class="{{ block() }}__adornment"><ng-content select="[okklyFieldEndAdornment]" /></span>
  }
</div>

@if (helperText()) {
  <span [id]="helperId()" class="{{ block() }}__helper">{{ helperText() }}</span>
}
