<ng-content select="[okklyButtonGroupAction]" />
@if (hasMenu()) {
  <button
    #chevron
    type="button"
    class="okkly-button-group__segment okkly-button-group__chevron"
    [disabled]="disabled()"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="menuAriaLabel()"
    (click)="toggle()"
    (keydown)="onChevronKeydown($event)"
  >
    <span class="okkly-button-group__chevron-icon" aria-hidden="true">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m6 9 6 6 6-6" />
      </svg>
    </span>
  </button>
}
@if (open()) {
  <div class="okkly-button-group__menu" role="menu">
    <ng-content select="[okklyButtonGroupMenuItem]" />
  </div>
}
