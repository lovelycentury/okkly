<span class="okkly-severity-icon__icon">
  <ng-content select="[okklySeverityIconGlyph]" />
  @if (!hasCustomGlyph()) {
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      @switch (severity()) {
        @case ("success") {
          <path d="M20 6 9 17l-5-5" />
        }
        @case ("warning") {
          <path
            d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"
          />
          <path d="M12 9v4" />
          <path d="M12 17h.01" />
        }
        @case ("danger") {
          <path d="M18 6 6 18" />
          <path d="M6 6l12 12" />
        }
        @default {
          <circle cx="12" cy="12" r="9" />
          <path d="M12 10v6" />
          <path d="M12 7h.01" />
        }
      }
    </svg>
  }
</span>
