<div class="okkly-link-card__main">
  <div class="okkly-link-card__title-row">
    @if (featured()) {
      <span class="okkly-link-card__dot" aria-hidden="true"></span>
    }
    <h4 class="okkly-link-card__title okkly-truncation-ellipsis">{{ title() }}</h4>
  </div>
  @if (subtitle()) {
    <p class="okkly-link-card__subtitle">{{ subtitle() }}</p>
  }
</div>
<div class="okkly-link-card__aside">
  @if (meta()) {
    <span class="okkly-link-card__meta">{{ meta() }}</span>
  }
  <span class="okkly-link-card__arrow" aria-hidden="true">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M7 7h10v10" />
      <path d="M7 17 17 7" />
    </svg>
  </span>
</div>
