@if (!hasIcon() && dot()) {
  <span class="okkly-chip__dot" aria-hidden="true"></span>
}
<!--
  The icon slot renders unconditionally and collapses through `display`, so the
  `contentChild` query that decides it always has somewhere to project into.
-->
<span class="okkly-chip__icon" aria-hidden="true" [style.display]="hasIcon() ? null : 'none'"
  ><ng-content select="[okklyChipIcon]"
/></span>
<span class="okkly-chip__label okkly-truncation-ellipsis">{{ label() }}</span>
@if (removable()) {
  <button
    type="button"
    class="okkly-chip__remove"
    [disabled]="disabled()"
    [attr.aria-label]="removeLabel()"
    (click)="remove($event)"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M18 6 6 18" />
      <path d="M6 6l12 12" />
    </svg>
  </button>
}
