name: deploy
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# The apps (profile / iam / resume) live in their own repos and deploy
# themselves. This workflow only ships the Storybook static site.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile.storybook
          push: true
          tags: ghcr.io/lovelycentury/okkly/storybook:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "ops/docker-compose.yml,ops/Caddyfile"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1 # drop the ops/ prefix
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull
            docker compose up -d --remove-orphans
            # Caddyfile is a bind mount — invisible to compose's change
            # detection, so force a recreate to pick up config edits.
            docker compose up -d --force-recreate caddy
