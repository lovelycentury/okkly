name: Svelte Playwright component tests

# Reusable: `ci.yml` calls it to verify, `svelte-playwright-screenshots.yml`
# calls it with `update-snapshots` to refresh the committed baselines.
#
# @okkly/svelte pins its own Playwright toolchain (see its package.json and
# playwright.config.ts): @playwright/experimental-ct-svelte trails the
# version pinned everywhere else in the workspace, so this runs on its own
# container image rather than reusing playwright.yml's.
on:
  workflow_call:
    inputs:
      update-snapshots:
        type: boolean
        required: false
        default: false
        description: Rewrite the screenshot baselines instead of comparing against them.

permissions:
  contents: read

jobs:
  test:
    name: Component tests
    runs-on: ubuntu-latest
    # Screenshots are pixel-exact per platform, so the baselines belong to this
    # image. Pin it to the same version as packages/svelte's own
    # @playwright/test + playwright-core, not the workspace catalog's.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @okkly/svelte's tests alias the package to its own sources, so only
      # the workspace deps it imports (design-system) need a real build.
      - name: Build the workspace dependencies
        run: pnpm --filter "@okkly/svelte^..." --if-present run build

      # Behaviour tests gate the job. The screenshot matrices — everything under
      # `test.describe("Screenshot tests")` — run as their own step that reports
      # without failing the job, so a pixel diff never blocks a PR on its own.
      # (The axe scans ride along with the matrices, so they report the same
      # way.) Each run writes to its own folders: Playwright empties its output
      # directories when it starts. The browsers ship with the container image,
      # so both skip the download step `test:playwright` performs locally.
      - name: Run behaviour tests
        working-directory: packages/svelte
        env:
          CI: "true"
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/behaviour
        run: pnpm exec playwright test --grep-invert "Screenshot tests" --output test-results/behaviour

      - name: Run screenshot tests
        id: screenshots
        if: ${{ !cancelled() }}
        # Refreshing the baselines must not swallow a failure.
        continue-on-error: ${{ !inputs.update-snapshots }}
        working-directory: packages/svelte
        env:
          CI: "true"
          PW_UPDATE_SNAPSHOTS: ${{ inputs.update-snapshots && 'true' || '' }}
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/screenshots
        run: pnpm exec playwright test --grep "Screenshot tests" --output test-results/screenshots

      - name: Flag failed screenshots
        if: ${{ steps.screenshots.outcome == 'failure' }}
        run: echo "::warning title=Screenshot tests failed::A matrix no longer matches its baseline — see the svelte-playwright-results artifact for the diffs."

      # Under CI the config reports as `dot` + `blob`, so there is no HTML report
      # to upload. `test-results` holds the expected/actual/diff images of a
      # failed test; `npx playwright merge-reports --reporter html <blob dir>`
      # turns a blob into an HTML report.
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: svelte-playwright-results
          path: |
            packages/svelte/test-results
            packages/svelte/blob-report
          retention-days: 7

      - name: Upload the refreshed screenshots
        if: ${{ inputs.update-snapshots && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: svelte-screenshots
          path: packages/svelte/playwright/snapshots
          retention-days: 1
