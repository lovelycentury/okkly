name: Deploy React Storybook

on:
  push:
    branches: [main]
    paths:
      - "packages/react/**"
      - "packages/design-system/**"
      - "packages/icons/**"
      - "packages/shared/**"
      - "packages/react-hooks/**"
      - "ops/Dockerfile.storybook"
      - "ops/docker-compose.yml"
      - ".github/workflows/deploy-react-storybook.yml"

permissions:
  contents: read
  packages: write

# @okkly/react's Storybook, at react-storybook.okkly.dev (and the legacy
# storybook.okkly.lol alias). The apps (profile / iam / resume) live in their
# own repos and deploy themselves.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile.storybook
          build-args: PACKAGE=react
          push: true
          tags: ghcr.io/lovelycentury/okkly/storybook-react:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The compose file is shared across all four storybook deploys; only one
    # `docker compose up` on the VPS at a time.
    concurrency:
      group: storybook-vps-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "ops/docker-compose.yml"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1 # drop the ops/ prefix
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull storybook-react
            docker compose up -d --remove-orphans storybook-react
