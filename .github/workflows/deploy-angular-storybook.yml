name: Deploy Angular Storybook

on:
  push:
    branches: [main]
    paths:
      - "packages/angular/**"
      - "packages/design-system/**"
      - "ops/Dockerfile.storybook"
      - "ops/docker-compose.yml"
      - ".github/workflows/deploy-angular-storybook.yml"

permissions:
  contents: read
  packages: write

# @okkly/angular's Storybook, at angular-storybook.okkly.dev. The apps
# (profile / iam / resume) live in their own repos and deploy themselves.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile.storybook
          build-args: PACKAGE=angular
          push: true
          tags: ghcr.io/lovelycentury/okkly/storybook-angular:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The compose file is shared across all four storybook deploys; only one
    # `docker compose up` on the VPS at a time.
    concurrency:
      group: storybook-vps-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "ops/docker-compose.yml"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1 # drop the ops/ prefix
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull storybook-angular
            docker compose up -d --remove-orphans storybook-angular
