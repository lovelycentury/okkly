name: Vue Playwright component tests

# Reusable: `ci.yml` calls it to verify, `vue-playwright-screenshots.yml` calls
# it with `update-snapshots` to refresh the committed baselines.
on:
  workflow_call:
    inputs:
      update-snapshots:
        type: boolean
        required: false
        default: false
        description: Rewrite the screenshot baselines instead of comparing against them.

permissions:
  contents: read

jobs:
  test:
    name: Component tests
    runs-on: ubuntu-latest
    # Screenshots are pixel-exact per platform, so the baselines belong to this
    # image. Pin it rather than tracking `ubuntu-latest`'s rendering stack.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @okkly/shared (the contracts Box shares) resolves through its `exports` to
      # `dist`, which a fresh checkout does not have. Build the workspace
      # dependencies; @okkly/design-system exports its SCSS sources and has no
      # build to run.
      - name: Build the workspace dependencies
        run: pnpm --filter "@okkly/vue^..." --if-present run build

      # Behaviour tests are the whole job on a PR. The screenshot matrices —
      # everything under `test.describe("Screenshot tests")` — only run when
      # this workflow is called with `update-snapshots`, i.e. from
      # `vue-playwright-screenshots.yml`, which regenerates the baselines on
      # this pinned image and opens a PR with them. Note the axe scans ride
      # along with the matrices, so they run there and not on a PR either.
      # Each run writes to its own folders: Playwright empties its output
      # directories when it starts. The browsers ship with the container image,
      # so both skip the download step `test:playwright` performs locally.
      - name: Run behaviour tests
        working-directory: packages/vue
        env:
          CI: "true"
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/behaviour
        run: pnpm exec playwright test --grep-invert "Screenshot tests" --output test-results/behaviour

      # Only reached via `update-snapshots`, so a failure here is a real
      # failure of the refresh and must not be swallowed.
      - name: Refresh screenshot baselines
        if: ${{ inputs.update-snapshots && !cancelled() }}
        working-directory: packages/vue
        env:
          CI: "true"
          PW_UPDATE_SNAPSHOTS: "true"
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report/screenshots
        run: pnpm exec playwright test --grep "Screenshot tests" --output test-results/screenshots

      # Under CI the config reports as `dot` + `blob`, so there is no HTML report
      # to upload. `test-results` holds the expected/actual/diff images of a
      # failed test; `npx playwright merge-reports --reporter html <blob dir>`
      # turns a blob into an HTML report.
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vue-playwright-results
          path: |
            packages/vue/test-results
            packages/vue/blob-report
          retention-days: 7

      - name: Upload the refreshed screenshots
        if: ${{ inputs.update-snapshots && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vue-screenshots
          path: packages/vue/playwright/snapshots
          retention-days: 1
