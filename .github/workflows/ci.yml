name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run changeset:check

      - run: pnpm run check

      - run: pnpm run build:libs

      - run: pnpm run test

  # Real browsers, so these run on their own image rather than alongside `check`.
  # component-tests:
  #  uses: ./.github/workflows/react-playwright.yml

  # The only tests @okkly/angular and @okkly/vue have — no Vitest suite
  # covers their components any more.
  angular-component-tests:
    uses: ./.github/workflows/angular-playwright.yml

  vue-component-tests:
    uses: ./.github/workflows/vue-playwright.yml

  # @okkly/svelte's own Playwright toolchain (see its playwright.config.ts) —
  # a separate job because it pins a different Playwright/browser version.
  svelte-component-tests:
    uses: ./.github/workflows/svelte-playwright.yml
